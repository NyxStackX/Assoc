<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact - Libota</title>
<meta name="description" content="Devenez bénévole, partenaire ou donateur : contactez l'association Libota." />
<link rel="icon" type="image/svg+xml" href="../assets/media/favicon.svg" />
<link rel="stylesheet" href="../styles.css" />
</head>
<body data-base="../" data-page="contact.html">

<section class="tetepage">
<div class="enveloppe">
<p class="etiq" data-t="page_contact.etiquette">Nous rejoindre</p>
<h1 data-t="page_contact.titre">Engagez-vous à nos côtés</h1>
<p class="intro" data-t="page_contact.intro">Bénévole, partenaire ou donateur : trois façons de faire grandir notre mission.</p>
</div>
</section>

<section class="section">
<div class="enveloppe">
<div class="trio" id="engagements"></div>
</div>
</section>

<section class="section transparence">
<div class="enveloppe duo">
<div>
<p class="etiq" data-t="page_contact.form_label">Écrivez-nous</p>
<h2 data-t="page_contact.form_titre">Une question, un projet ?</h2>
<p class="prose" style="margin-top:16px" data-t="page_contact.form_intro"></p>
<form class="form" id="form">
<div class="ligne">
<input class="champ" type="text" id="c-prenom" required />
<input class="champ" type="text" id="c-nom" required />
</div>
<input class="champ" type="email" id="c-mail" required />
<select class="champ" id="c-sujet"></select>
<textarea class="champ" id="c-message" rows="5" required></textarea>
<button class="bouton" type="submit" data-t="page_contact.form_bouton">Envoyer le message</button>
<p class="msg" id="c-msg"></p>
</form>
</div>
<div>
<div class="encadre">
<h3 data-t="page_contact.coordonnees_titre">Nos coordonnées</h3>
<div class="infos" id="coordonnees" style="margin-top:22px"></div>
<div class="reseaux" id="reseaux"></div>
</div>
</div>
</div>
</section>

<script src="../contenu.js"></script>
<script src="../assets/js/site.js"></script>
<script>
(function(){
var S=window.SITE,g=S.get,e=S.esc,u=S.url;
var ch=g('page_contact.form_champs')||{};
document.getElementById('c-prenom').placeholder=e(ch.prenom);
document.getElementById('c-nom').placeholder=e(ch.nom);
document.getElementById('c-mail').placeholder=e(ch.email);
document.getElementById('c-message').placeholder=e(ch.message);

var sel=document.getElementById('c-sujet');
sel.innerHTML='<option value="">'+e(g('page_contact.form_sujet_defaut'))+'</option>'+
(g('page_contact.form_sujets')||[]).map(function(s){return '<option>'+e(s)+'</option>'}).join('');

S.set('engagements',(g('page_contact.engagements')||[]).map(function(x,i){
return '<div><div class="n">'+String(i+1).padStart(2,'0')+'</div><h3>'+e(x.titre)+'</h3><p>'+e(x.texte)+'</p>'+
'<button class="act" data-sujet="'+e(x.sujet)+'">'+e(x.action)+' →</button></div>';
}).join(''));

S.set('coordonnees',(g('page_contact.coordonnees')||[]).map(function(l){
return '<div class="l"><span class="cle">'+e(l.cle)+'</span><span class="val">'+e(l.valeur)+'</span></div>';
}).join(''));

S.set('reseaux',(g('page_contact.reseaux')||[]).map(function(r){
return '<a href="'+u(r.url)+'">'+e(r.label)+'</a>';
}).join(''));

document.getElementById('engagements').addEventListener('click',function(ev){
var b=ev.target.closest('[data-sujet]');if(!b)return;
var v=b.getAttribute('data-sujet');
for(var i=0;i<sel.options.length;i++){if(sel.options[i].text.indexOf(v)>-1||v.indexOf(sel.options[i].text)>-1)sel.selectedIndex=i}
document.getElementById('c-prenom').focus();
});

document.getElementById('form').addEventListener('submit',function(ev){
ev.preventDefault();
document.getElementById('c-msg').textContent=e(g('page_contact.form_confirmation'));
this.reset();sel.selectedIndex=0;
});
})();
</script>
<script src="../assets/js/animations.js"></script>
</body>
</html>
