<!DOCTYPE html>
<html lang="fr">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Informations - Libota
  </title>
  <meta content="Mentions légales, confidentialité, cookies et conditions d'utilisation du site Libota." name="description"/>
  <link href="../assets/media/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="../styles.css" rel="stylesheet"/>
 </head>
 <body data-base="../" data-page="legal.html">
  <section class="tetepage">
   <div class="enveloppe">
    <p class="etiq">
     Informations
    </p>
    <h1 id="titre">
     Mentions légales
    </h1>
    <p class="intro" id="intro">
    </p>
    <div class="sommaire" id="sommaire">
    </div>
   </div>
  </section>
  <section class="section">
   <div class="enveloppe legal" id="blocs">
   </div>
  </section>
  <script src="../contenu.js">
  </script>
  <script src="../assets/js/site.js">
  </script>
  <script>
   (function(){
var S=window.SITE,g=S.get,e=S.esc;
var pages=g('legal')||[];
var cle=(new URLSearchParams(location.search)).get('p')||(pages[0]||{}).cle;
var p=pages.filter(function(x){return x.cle===cle})[0]||pages[0]||{};
document.title=e(p.titre)+' - Libota';
document.getElementById('titre').textContent=e(p.titre);
document.getElementById('intro').textContent=e(p.intro);
S.set('sommaire',pages.map(function(x){
return '<a href="legal.html?p='+e(x.cle)+'"'+(x.cle===p.cle?' aria-current="page"':'')+'>'+e(x.titre)+'</a>';
}).join(''));
S.set('blocs',(p.blocs||[]).map(function(b){
return '<div class="bloc-legal"><h2>'+e(b.titre)+'</h2><p>'+e(b.texte)+'</p></div>';
}).join(''));
})();
  </script>
  <script src="../assets/js/animations.js">
  </script>
 </body>
</html>
