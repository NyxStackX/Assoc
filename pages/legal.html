<!doctype html>
<html lang="fr">
	<!-- # Métadonnées et feuilles de style -->
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Informations - Libota</title>
		<meta
			name="description"
			content="Mentions légales, confidentialité, cookies et conditions d'utilisation du site Libota."
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="../assets/media/favicon.svg"
		/>
		<link rel="stylesheet" href="../styles.css" />
	</head>

	<!-- # Corps de la page -->
	<body data-base="../" data-page="legal.html">
		<!-- # Haut de page -->
		<section class="tetepage">
			<div class="enveloppe">
				<p class="etiq">Informations</p>
				<h1 id="titre">Mentions légales</h1>
				<p class="intro" id="intro"></p>
				<div class="sommaire" id="sommaire"></div>
			</div>
		</section>

		<!-- # Contenu des mentions -->
		<section class="section">
			<div class="enveloppe legal" id="blocs"></div>
		</section>

		<!-- # Script : contenu.js -->
		<script src="../contenu.js"></script>

		<!-- # Script : site.js -->
		<script src="../assets/js/site.js"></script>

		<!-- # Script de la page -->
		<script>
			(function () {
				// # Outils de la page
				var S = window.SITE,
					g = S.get,
					e = S.esc;

				// # Choix de la page affichée
				var pages = g('legal') || [];
				var cle =
					new URLSearchParams(location.search).get('p') ||
					(pages[0] || {}).cle;
				var p =
					pages.filter(function (x) {
						return x.cle === cle;
					})[0] ||
					pages[0] ||
					{};

				// # Titre et introduction
				document.title = e(p.titre) + ' - Libota';
				document.getElementById('titre').textContent = e(p.titre);
				document.getElementById('intro').textContent = e(p.intro);

				// # Sommaire
				S.set(
					'sommaire',
					pages
						.map(function (x) {
							return (
								'<a href="legal.html?p=' +
								e(x.cle) +
								'"' +
								(x.cle === p.cle
									? ' aria-current="page"'
									: '') +
								'>' +
								e(x.titre) +
								'</a>'
							);
						})
						.join('')
				);

				// # Contenu
				S.set(
					'blocs',
					(p.blocs || [])
						.map(function (b) {
							return (
								'<div class="bloc-legal"><h2>' +
								e(b.titre) +
								'</h2><p>' +
								e(b.texte) +
								'</p></div>'
							);
						})
						.join('')
				);
			})();
		</script>

		<!-- # Script : animations.js -->
		<script src="../assets/js/animations.js"></script>
	</body>
</html>
