<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden;background:#f5f1e6}.marque-zone{display:flex;align-items:center;justify-content:center;background:#15281e}.marque-zone span{font-family:'Newsreader',Georgia,serif;font-size:210px;line-height:1;color:#f5f1e6;letter-spacing:-.02em}.strip{display:grid;grid-template-rows:repeat(3,1fr)}.strip i{display:block}</style>
</head>
<body>
<div class="marque-zone"><span>Libota</span></div>
<div class="strip"><i style="background:#ddb878"></i><i style="background:#a2601c"></i><i style="background:#1d4632"></i></div>
</body>
</html>
